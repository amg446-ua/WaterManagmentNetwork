services:

  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CLUSTER_ID: tmlFBdSFRfe2xbKY8LSUlw
    
    volumes:
      - ./broker/data:/tmp/kraft-combined-logs

  wm-front:
    build:
      context: .
      dockerfile: Docker/front/Dockerfile
    depends_on:
      - broker
    ports:
      - "8080:8080"
      - "5050:5050"
    container_name: wm-front
    command: ["8080", "5050", "broker:9092"]
    volumes:
      - ./data:/app/data

  wm-ws-m:
    build:
      context: .
      dockerfile: Docker/wm-ws-m/Dockerfile
    container_name: wm-ws-m
    ports:
      - "5051:5051"
    depends_on:
      - broker
      - wm-front
    command: ["wm-front", "5050", "REGISTRO#WS-04#RiverPark", "0.0.0.0", "5051", "broker:9092"]
  
  wm-ws-e:
    build:
      context: .
      dockerfile: Docker/wm-ws-e/Dockerfile
    depends_on:
      - broker
      - wm-front
      - wm-ws-m
    stdin_open: true
    tty: true
    command: ["wm-ws-m", "5051"]

  wm-fo:
    build:
      context: .
      dockerfile: Docker/wm-fo/Dockerfile
    depends_on:
      - broker
      - wm-front
    container_name: wm-fo
    ports:
      - "8082:8082"
    command: ["WM_FO_Frontend.py", "broker:9092", "FO-01", "8082"]